# docker-compose.yml
version: '3.8'

services:
  # 🗄️ PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: milk_postgres
    restart: always
    environment:
      POSTGRES_USER: milk_user
      POSTGRES_PASSWORD: milk_pass
      POSTGRES_DB: milk_supply_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - milk_network

  # 🖥️ Adminer (Database GUI)
  adminer:
    image: adminer:latest
    container_name: milk_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - milk_network

  # 🔴 Redis (OTP Cache + Session Store)
  redis:
    image: redis:7-alpine
    container_name: milk_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - milk_network

 

volumes:
  postgres_data:
  redis_data:

networks:
  milk_network:
    driver: bridge